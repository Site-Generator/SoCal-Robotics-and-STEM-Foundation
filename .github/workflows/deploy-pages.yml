name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: generator/package-lock.json

      - name: Install generator dependencies
        run: npm ci
        working-directory: generator

      - name: Derive images/home-content.json from club.json
        run: node scripts/derive-home-content.js

      - name: Build site
        run: node build.js
        working-directory: generator
        env:
          CLUB_SLUG: socal-robotics-stem-foundation
          CLUB_DATA_DIR: ..

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: generator/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
