name: Notify club-fleet-tools

# Deliberately contains no club-specific information (no repo URLs, no
# roster) — this file is subtree-copied into every club repo's generator/
# folder, so anything club-specific here would leak to every club's
# officers. It only knows about club-fleet-tools' own coordinates.
on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch core-updated event to club-fleet-tools
        run: |
          curl -sSf -X POST \
            -H "Authorization: token ${{ secrets.FLEET_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Site-Generator/club-fleet-tools/dispatches \
            -d '{"event_type":"core-updated"}'
