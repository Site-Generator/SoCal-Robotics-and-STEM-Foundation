media:
  - name: images
    label: "Images"
    input: images
    output: images
    extensions: [jpg, jpeg, png, webp, gif, svg]
    categories: [image]

content:
  - name: club
    label: "SoCal Robotics & STEM Foundation"
    type: file
    path: club.json
    format: json
    fields:
      - name: clubName
        label: "Club Name"
        type: string
        required: true
      - name: advisorName
        label: "Advisor Name"
        type: string
      - name: description
        label: "Description"
        type: text
      - name: meetingTime
        label: "Meeting Time"
        type: string
      - name: siteMode
        label: "Site Mode"
        type: select
        options:
          values:
            - label: "Dynamic (Home page shows teasers)"
              value: dynamic
            - label: "Multipage (no Home page teasers)"
              value: multipage
            - label: "Single — classic long-scroll page — do not use unless you know why"
              value: single
      - name: tagline
        label: "Tagline"
        type: string
      - name: heroImage
        label: "Hero Image"
        type: image
        options:
          media: images
      - name: moreText
        label: "More Tab Lead Text"
        type: text
      - name: theme
        label: "Theme"
        type: object
        fields:
          - name: primaryColor
            label: "Primary Color (hex, e.g. #2b6cb0)"
            type: string
          - name: accentColor
            label: "Accent Color (hex, e.g. #ecc94b)"
            type: string
          - name: accentTextColor
            label: "Accent Text Color (hex, e.g. #1f2733)"
            type: string
          - name: backgroundColor
            label: "Background Color (hex, e.g. #ffffff)"
            type: string
          - name: surfaceColor
            label: "Surface Color (hex, e.g. #f5f7fa)"
            type: string
          - name: textColor
            label: "Text Color (hex, e.g. #1f2733)"
            type: string
          - name: mutedTextColor
            label: "Muted Text Color (hex, e.g. #5b6675)"
            type: string
          - name: borderColor
            label: "Border Color (hex, e.g. #e2e8f0)"
            type: string
          - name: headingFont
            label: "Heading Font (Google Fonts name, e.g. Newsreader)"
            type: string
          - name: bodyFont
            label: "Body Font (Google Fonts name, e.g. Inter)"
            type: string
      - name: links
        label: "Quick Links"
        type: object
        list: true
        summary: "{label}"
        fields:
          - name: label
            label: "Label"
            type: string
            required: true
          - name: url
            label: "URL"
            type: string
            required: true
          - name: icon
            label: "Icon"
            type: image
            options:
              media: images
      - name: officers
        label: "Officers"
        type: object
        list: true
        summary: "{name} — {role}"
        fields:
          - name: name
            label: "Name"
            type: string
            required: true
          - name: role
            label: "Role"
            type: string
            required: true
          - name: photo
            label: "Photo"
            type: image
            options:
              media: images
      - name: events
        label: "Events"
        type: object
        list: true
        summary: "{title} ({date})"
        fields:
          - name: title
            label: "Title"
            type: string
            required: true
          - name: date
            label: "Date"
            type: date
            required: true
          - name: description
            label: "Description"
            type: text
      - name: awards
        label: "Awards"
        type: object
        list: true
        summary: "{title} ({year})"
        fields:
          - name: title
            label: "Title"
            type: string
            required: true
          - name: year
            label: "Year"
            type: number
            required: true
          - name: description
            label: "Description"
            type: text
          - name: featured
            label: "Pin to Home page Awards teaser"
            type: boolean
      - name: stats
        label: "Home Page Stats"
        type: object
        list: true
        summary: "{value} — {label}"
        fields:
          - name: label
            label: "Label"
            type: string
            required: true
          - name: value
            label: "Value (e.g. 15+, 3, 200+)"
            type: string
            required: true
      - name: images
        label: "Gallery Images"
        type: image
        options:
          media: images
          multiple:
            max: 60
      - name: heroEyebrow
        label: "Home Hero — Eyebrow Text"
        type: string
      - name: heroTitleLine1
        label: "Home Hero — Title Line 1"
        type: string
      - name: heroTitleLine2
        label: "Home Hero — Title Line 2"
        type: string
      - name: heroLead
        label: "Home Hero — Lead Paragraph"
        type: text
      - name: process
        label: "Home Page — \"What We Do\" Steps"
        type: object
        list: true
        summary: "{title}"
        fields:
          - name: title
            label: "Title"
            type: string
            required: true
          - name: description
            label: "Description"
            type: text
      - name: testimonial
        label: "Home Page — Testimonial"
        type: object
        fields:
          - name: quote
            label: "Quote"
            type: text
          - name: attribution
            label: "Attribution"
            type: string
      - name: ctaButtons
        label: "Home Page — CTA Buttons"
        type: object
        list: true
        summary: "{label}"
        fields:
          - name: label
            label: "Button Label"
            type: string
            required: true
      - name: footerTagline
        label: "Footer Tagline"
        type: text
      - name: socialLinks
        label: "Footer — Social Links"
        type: object
        fields:
          - name: instagramUrl
            label: "Instagram URL"
            type: string
          - name: donateUrl
            label: "Donate URL"
            type: string
          - name: volunteerUrl
            label: "Volunteer URL"
            type: string
